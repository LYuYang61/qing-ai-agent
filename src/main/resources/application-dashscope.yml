spring:
  ai:
    model:
      chat: dashscope
    dashscope:
      enabled: true
      # 本地 RAG 启动时会为 Markdown 文档生成向量；适配器默认值为 text-embedding-v3，此处显式配置为 qwen3.7-text-embedding。
      embedding:
        enabled: true
        options:
          model: qwen3.7-text-embedding

qing:
  ai:
    rag:
      local:
        # 开启后首次启动会调用 Embedding API 构建内存向量库。
        enabled: true
        store: memory
        similarity-threshold: 0.45
        top-k: 4
        metadata:
          # 每个文档会额外调用一次 ChatModel，学习时按需打开，默认关闭以控制成本。
          keyword-enrichment-enabled: false
          keyword-count: 5
      cloud:
        # 云知识库需要先在百炼创建索引，配置索引名称后再手动开启。
        enabled: false
        index-name: ${QING_AI_RAG_CLOUD_INDEX:}
        workspace-id: ${QING_AI_RAG_WORKSPACE_ID:}
        dense-similarity-top-k: 5
        sparse-similarity-top-k: 5
        metadata:
          # 自动抽取规则必须在百炼创建知识库时配置；这里仅记录实验意图和字段名。
          auto-extraction-enabled: false
          fields: []
        # 适配器 1.1.2.0 的云端 metadata 过滤格式，例如：
        # - key: status
        #   value: 单身
        search-filters: []
      hybrid:
        enabled: false
        keyword-top-k: 6
        result-top-k: 6
        reciprocal-rank-constant: 60
      query-translation:
        enabled: false
        base-url: ${QING_AI_TRANSLATION_BASE_URL:https://libretranslate.com}
        api-key: ${LIBRETRANSLATE_API_KEY:}
        source-language: auto
        target-language: zh
      # 查询压缩：把连续对话中的追问改写成独立问题再检索；默认开启——守卫保证首轮与无记忆链路
      # 零额外成本，多轮对话中每次追问多一次模型调用，换取检索对症。
      query-compression:
        enabled: true
      # 查询重写：面向检索系统规范化查询表述；开启后每次请求多一次模型调用。
      query-rewrite:
        enabled: false
        target-search-system: vector store
      # 多查询扩展：一个问题裂变成多个检索变体；开启后除一次模型调用外，每个变体各触发一轮检索。
      query-expansion:
        enabled: false
        number-of-queries: 3
        include-original: true
      postgres:
        enabled: false
