spring:
  config:
    activate:
      on-profile: mcp
  ai:
    mcp:
      client:
        enabled: true
        name: qing-ai-agent-mcp-client
        version: 0.0.1
        type: SYNC
        initialized: true
        request-timeout: 20s
        toolcallback:
          enabled: true
        # 直接使用 YAML 配置时可以让 Spring 解析环境变量，再把它传给 STDIO 子进程。
        stdio:
          connections:
            image-search:
              command: ${QING_MCP_JAVA_COMMAND:java}
              args:
                - -Dspring.ai.mcp.server.stdio=true
                - -Dspring.profiles.active=stdio
                - -Dspring.main.web-application-type=none
                - -Dspring.main.banner-mode=off
                - -Dlogging.level.root=OFF
                - -jar
                - mcp/image-search-mcp-server/target/image-search-mcp-server-0.0.1-SNAPSHOT.jar
              env:
                PEXELS_API_KEY: ${PEXELS_API_KEY:}
            date-place:
              command: ${QING_MCP_JAVA_COMMAND:java}
              args:
                - -Dspring.ai.mcp.server.stdio=true
                - -Dspring.profiles.active=stdio
                - -Dspring.main.web-application-type=none
                - -Dspring.main.banner-mode=off
                - -Dlogging.level.root=OFF
                - -jar
                - mcp/date-place-mcp-server/target/date-place-mcp-server-0.0.1-SNAPSHOT.jar
