spring:
  application:
    name: qing-ai-agent
  ai:
    model:
      chat: ollama
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma3:1b
    dashscope:
      enabled: false
      api-key: "${DASHSCOPE_API_KEY:${AI_DASHSCOPE_API_KEY:}}"
      chat:
        options:
          # qwen3.7-plus/flash 属于原生多模态系列,百炼只在多模态端点提供服务:
          # 必须开启 multi-model 让适配器把请求发往 multimodal-generation,否则报 url error。
          # qwen3.7-max 额度耗尽后全局切换到 flash;想换 plus 只改模型名(同为多模态系)。
          model: qwen3.7-flash-2026-07-15
          multi-model: true
  # 上传接口只用于多模态学习示例，限制单个请求大小，避免误传超大文件。
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 与教程保持一致，统一通过 /api 作为后端接口上下文路径。
server:
  port: 8124
  servlet:
    context-path: /api

# Springdoc 负责生成 OpenAPI 文档，扫描根项目的 controller 包。
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: '/**'
      packages-to-scan: com.lian.qingaiagent.controller

# Knife4j 在 Springdoc 文档之上提供中文接口文档页面，访问路径为 /api/doc.html。
knife4j:
  enable: true
  setting:
    language: zh_cn

# 第三期扩展知识配置：默认使用文件记忆；改为 memory 可观察重启后记忆丢失的差异。
qing:
  ai:
    chat-memory:
      backend: file
      file-dir: ${QING_AI_CHAT_MEMORY_DIR:${user.dir}/tmp/chat-memory}
      max-messages: 20
    multimodal:
      model: qwen3.7-flash-2026-07-15
      max-upload-bytes: 10485760
